<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>咚咚造物局｜LINE 購物入口 V1.12.2</title>
  <style>
    body { margin: 0; background: #fff8ee; color: #29223d; font: 18px/1.6 system-ui, sans-serif; }
    main { width: min(100% - 2rem, 34rem); margin: 3rem auto; }
    h1 { margin-bottom: .5rem; }
    a { display: inline-block; padding: .6rem 1rem; background: #592d8a; color: white; border-radius: .5rem; }
    footer { margin-top: 1.5rem; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>咚咚造物局</h1>
    <p id="status" role="status">正在開啟 LINE 購物頁，讓新訂單能在「我的訂單」查到。</p>
    <a id="shop-link" href="https://liff.line.me/2012475448-AGVHxmxw?view=shop">開啟 LINE 購物頁</a>
    <footer>LINE 購物入口 V1.12.2</footer>
  </main>
  <script>
    // V1.12.2：首頁統一導向 LINE 購物。避免 LIFF 指回首頁時循環轉址。
    const shopLink = document.querySelector('#shop-link');
    const query = new URLSearchParams(location.search);
    if (query.has('liff.state') || query.has('liff.referrer')) {
      document.querySelector('#status').textContent = 'LINE 購物入口暫時無法開啟，請聯絡咚咚造物局。';
      shopLink.hidden = true;
    } else {
      location.replace(shopLink.href);
    }
  </script>
</body>
</html>
